name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run Detox E2E tests on an Android emulator'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * *' # nightly run includes E2E

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mock server
        working-directory: mock-server
        run: npm install
      - name: Install test framework
        working-directory: api-test-framework
        run: npm install

      - name: Type check
        run: |
          (cd mock-server && npm run typecheck)
          (cd api-test-framework && npm run typecheck)

      - name: Start mock server
        working-directory: mock-server
        run: |
          MOCK_LOG=off npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && exit 0; sleep 1; done
          echo "Mock server did not start" && exit 1

      - name: Run API tests
        working-directory: api-test-framework
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api-test-framework/reports/

      - name: Add summary
        if: always()
        run: |
          echo "### API tests" >> $GITHUB_STEP_SUMMARY
          grep -o 'tests="[0-9]*"' api-test-framework/reports/junit.xml | cut -d'"' -f2 | paste -sd+ | bc | xargs -I{} echo "- Total tests: {}" >> $GITHUB_STEP_SUMMARY
          grep -o 'failures="[0-9]*"' api-test-framework/reports/junit.xml | cut -d'"' -f2 | paste -sd+ | bc | xargs -I{} echo "- Failures: {}" >> $GITHUB_STEP_SUMMARY
          echo "- Download the HTML report from the **api-test-reports** artifact." >> $GITHUB_STEP_SUMMARY

  mobile-unit:
    name: Mobile unit + component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:coverage -- --ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile-app/coverage/

  mobile-e2e-android:
    name: Detox E2E (Android)
    if: github.event_name == 'schedule' || inputs.run_e2e
    needs: [api-tests, mobile-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DETOX_AVD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install
        run: |
          (cd mock-server && npm install)
          (cd mobile-app && npm install)

      - name: Generate native Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --clean

      - name: Build app for Detox
        working-directory: mobile-app
        run: npm run e2e:build:android

      - name: Start mock server
        working-directory: mock-server
        run: |
          MOCK_LOG=off npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && exit 0; sleep 1; done
          exit 1

      - name: Run Detox tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: test
          profile: pixel_6
          disable-animations: true
          working-directory: mobile-app
          script: npx detox test -c android.emu.release --headless --record-logs failing --take-screenshots failing

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: mobile-app/e2e/artifacts/
